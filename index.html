<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/><title>好命密碼 · 數字磁場</title><script src="https://cdn.jsdelivr.net/npm/solarlunar@3.1.0/dist/solarlunar.min.js"></script><style>

<div class="container">
<header><h1>好命密碼 · 數字磁場</h1><p class="sub">跟愛德華門派 · 先天／流年／後天分流</p></header>

</div>

<div class="card"><div class="card-title">詳細說明</div><div id="details"></div></div>

</div>
</section>
<section id="sec-wiki" class="section"><div class="card"><div class="card-title">八大磁場百科</div><div id="wikiGrid"></div></div></section>
</div>
<script>
const FIELDS={tianyi:{name:'天醫',pol:'吉',rank:'大吉星',pairs:['13','31','68','86','49','94','27','72'],short:'有錢路同貴人幫一手',pros:['聰明睿智','善解人意','心胸開闊','學習能力強'],cons:['太善良','沒主見','容易被騙'],job:'能成就事業，帶來連續財富。',wealth:'正財偏財都有，但唔會守財。',love:'正桃花、婚姻美滿；女性旺夫。',health:'血壓、血液循環、眼耳鼻。',friend:'易遇貴人。',note:'老年人唔宜天醫太多。'},shengqi:{name:'生氣',pol:'吉',rank:'大吉星',pairs:['14','41','67','76','39','93','28','82'],short:'貴人多、人緣好',pros:['貴人多','樂天','溝通強'],cons:['懶散','三分鐘熱度'],job:'適合公關銷售服務業。',wealth:'貴人來財，不善理財。',love:'隨緣，婚後和諧。',health:'五官或腸胃、易肥胖。',friend:'識人廣。',note:'大吉星。'},yannian:{name:'延年',pol:'吉',rank:'小吉星',pairs:['19','91','78','87','34','43','26','62'],short:'有主見、肯扛責任',pros:['領導格局','懂守財'],cons:['固執','不圓滑'],job:'專業能力強，易成領導。',wealth:'靠自己辛苦，識守財。',love:'專一高標準。',health:'肩頸腰、睡眠、心臟。',friend:'真正夥伴耐。',note:'⚠️大延年19/91女性不能使用。'},fuwei:{name:'伏位',pol:'平',rank:'依附',pairs:['11','22','33','44','66','77','88','99'],short:'延續上一段勢，隨吉則吉隨凶則凶',pros:['謹慎有耐性'],cons:['保守被動'],job:'按部就班。',wealth:'穩定求財。',love:'顧家平淡。',health:'慢性隱性病。',friend:'舊人多。',note:'伏位跟前面嗰粒星。'},huohai:{name:'禍害',pol:'凶',rank:'小兇星',pairs:['17','71','89','98','46','64','23','32'],short:'口舌是非、易開刀意外',pros:['口才好'],cons:['脾氣差','口舌'],job:'以口為業。',wealth:'開口來財，易破財。',love:'易吵架。',health:'呼吸道、開刀、意外。',friend:'小心讒言。',note:'車牌見禍害要小心交通意外。'},liusha:{name:'六煞',pol:'凶',rank:'小兇星',pairs:['16','61','47','74','38','83','29','92'],short:'感情情緒煩、易破財',pros:['交際強','異性緣'],cons:['情緒化','為情所困'],job:'公關中介服務。',wealth:'人際來財唔守。',love:'偏桃花。',health:'皮膚腸胃情緒。',friend:'界線要清。',note:'六煞+五鬼離婚率高。'},wugui:{name:'五鬼',pol:'凶',rank:'大兇星',pairs:['18','81','79','97','36','63','24','42'],short:'起起落落、錢來得快去得快',pros:['鬼才創新'],cons:['反復無常'],job:'變動多嘅行業。',wealth:'偏財來去快。',love:'不利婚姻。',health:'意外血光、心臟病代名詞。',friend:'人脈流動大。',note:'車牌見五鬼要特別留意意外。'},jueming:{name:'絕命',pol:'凶',rank:'大兇星',pairs:['12','21','69','96','48','84','37','73'],short:'大上大落、易衝動',pros:['毅力驚人'],cons:['衝動極端'],job:'創業投資。',wealth:'開銷大易負債。',love:'易分手離婚。',health:'肝腎膽泌尿。',friend:'易絕交。',note:'車牌見絕命，出行宜穩陣。'}};
const PAIR_MAP={};Object.keys(FIELDS).forEach(function(k){FIELDS[k].pairs.forEach(function(p){PAIR_MAP[p]=k;});});
const KIND_INFO={phone:{tag:'後天分身',text:'影響而家運勢。重點睇尾段、後五位0、絕對定律。',ph:'例如 97302181'},id:{tag:'流年運程',text:'證件數字放兩次：第一輪出世至約48歲，第二輪約48–98歲。證件本身唔能改。',ph:'例如 A123456(7)'},birth:{tag:'先天命格',text:'出世就定，只講底子，唔用嚟改號。',ph:''},plate:{tag:'交通磁場',text:'教材用車牌睇開車、出行同路上安危，唔係睇事業財運。英文字母一齊計（A=01…Z=26）。車牌唔計0。',ph:'例如 AB1234'},address:{tag:'家宅磁場',text:'門牌睇家宅、家人健康、居住氣場。字母同樣轉換。',ph:'例如 8A'},account:{tag:'財運磁場',text:'帳號睇財富進出同守財。',ph:'例如 0123456789'},other:{tag:'後天磁場',text:'日常數字影響使用場景。',ph:'輸入數字'}};
let currentKind='phone';
function bindUI(){
 document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});document.getElementById('sec-'+t.getAttribute('data-sec')).classList.add('active');});});
 document.querySelectorAll('#kindPills .pill').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('#kindPills .pill').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');currentKind=btn.getAttribute('data-kind');document.getElementById('kindHint').innerHTML='<span class="tag">'+KIND_INFO[currentKind].tag+'</span>'+KIND_INFO[currentKind].text;document.getElementById('inputText').style.display=currentKind==='birth'?'none':'block';document.getElementById('inputBirth').style.display=currentKind==='birth'?'block':'none';if(KIND_INFO[currentKind].ph)document.getElementById('numInput').placeholder=KIND_INFO[currentKind].ph;});});
 document.getElementById('analyzeBtn').addEventListener('click',analyze);
 document.getElementById('clearBtn').addEventListener('click',function(){document.getElementById('numInput').value='';document.getElementById('birthInput').value='';document.getElementById('results').style.display='none';});
 document.getElementById('numInput').addEventListener('keydown',function(e){if(e.key==='Enter')analyze();});
}
function expandLetters(s){return s.replace(/[A-Za-z]/g,function(ch){return String(ch.toUpperCase().charCodeAt(0)-64).padStart(2,'0');});}
function plateToDigits(s){var out='';for(var i=0;i<s.length;i++){var ch=s.charAt(i);if(/[A-Za-z]/.test(ch))out+=String(ch.toUpperCase().charCodeAt(0)-64).padStart(2,'0');else if(/[1-9]/.test(ch))out+=ch;}return out;}
function extractDigits(s){return (s.match(/\d/g)||[]).join('');}
function birthCode(iso){if(!iso)return null;var p=iso.split('-');var y=+p[0],m=+p[1],d=+p[2];var base=y<=2000?1911:1971;var yearNum=y-base;var lm=m,ld=d,usedLunar=false,lunarText='';try{var fn=solarLunar&&(solarLunar.solar2lunar||(solarLunar.default&&solarLunar.default.solar2lunar));if(fn){var L=fn(y,m,d);if(L&&(L.lMonth||L.month)){lm=L.lMonth||L.month;ld=L.lDay||L.day;usedLunar=true;lunarText='農曆'+(L.isLeap||L.isLeapMonth?'閏':'')+lm+'月'+ld+'日';}}}catch(e){}
var code=String(yearNum)+String(lm)+String(ld).padStart(2,'0');
return {code:code,text:y+'年'+m+'月'+d+'日（新曆）→ '+(usedLunar?lunarText:'暫用新曆月日')+'；'+y+'−'+base+'='+yearNum+' + '+lm+String(ld).padStart(2,'0')+' → '+code};}
function buildPairs(digits,kind){if(kind==='birth'||kind==='plate'){var out=[];for(var i=0;i<digits.length-1;i++){var pair=digits.charAt(i)+digits.charAt(i+1);var key=PAIR_MAP[pair];var field=key||'fuwei';var note=key?'':(pair.indexOf('0')>=0?'含0當伏位':'非標準當伏位');if(field==='fuwei'&&out.length){field=out[out.length-1].field;note+=(note?'；':'')+'伏位延續「'+FIELDS[field].name+'」';}out.push({pair:pair,display:pair,field:field,connector:null,note:note});}return out;}
var source=kind==='phone'?digits:digits.replace(/5/g,'');var core=[],pending='';for(var i=0;i<source.length;i++){var ch=source.charAt(i);if(ch==='0'||(kind==='phone'&&ch==='5'))pending+=ch;else{core.push({d:ch,bridge:pending});pending='';}}var trailing=pending,out=[];for(var j=1;j<core.length;j++){var a=core[j-1].d,b=core[j].d,bridge=core[j].bridge;var pair=a+b,key=PAIR_MAP[pair];if(!key)continue;var connector=null;if(kind==='phone'&&bridge.indexOf('5')>=0)connector='5';else if(bridge.indexOf('0')>=0)connector='0';var field=key,note='';if(connector==='5')note='夾5顯性';if(connector==='0')note='夾0隱性弱化';if(key==='fuwei'&&out.length){field=out[out.length-1].field;note+=(note?'；':'')+'伏位延續「'+FIELDS[field].name+'」';}out.push({pair:pair,display:a+bridge+b,field:field,connector:connector,note:note});}if(out.length&&trailing){var last=out[out.length-1];if(trailing.indexOf('0')>=0){last.display+=trailing;last.note=(last.note||'')+'；尾0放大';}}return out;}
var BODY_POS=['腿腳','腰腹','腸胃','胸腔','腦袋'];
var PALACE_POS=[{name:'子女／下屬宮',effect:'下屬或孩子不聽話，或孩子身體差'},{name:'夫妻宮',effect:'夫妻宮空：感情不好、兩地分離，或對方身體不好'},{name:'自己宮',effect:'自己付出多都沒有收穫'},{name:'兄弟朋友宮',effect:'人際關係不佳，遇事外力無助'},{name:'父母宮',effect:'與父母感情不好，或父母身體欠佳／離世'}];
function checkPhoneZeros(digits){var last5=digits.slice(-5),hits=[];for(var i=0;i<last5.length;i++){if(last5.charAt(i)==='0'){var fromEnd=last5.length-1-i;if(fromEnd<5)hits.push({pos:fromEnd+1,body:BODY_POS[fromEnd],palace:PALACE_POS[fromEnd].name,effect:PALACE_POS[fromEnd].effect});}}return hits;}
function checkPhoneRules(digits,pairs){var warns=[],last4=digits.slice(-4);if(last4.indexOf('0')>=0)warns.push({level:'bad',text:'最後4位含有0（教材：手機最後4位不可以為0）'});for(var i=0;i<last4.length-1;i++){var pp=last4.charAt(i)+last4.charAt(i+1);var fk=PAIR_MAP[pp];if(fk&&FIELDS[fk].pol==='凶'){warns.push({level:'bad',text:'最後4位出現兇星「'+FIELDS[fk].name+'」（'+pp+'）'});break;}}if(digits.indexOf('00')>=0)warns.push({level:'warn',text:'出現00：容易成為別人踏腳石'});var hasT=pairs.some(function(p){return p.field==='tianyi';});var hasS=pairs.some(function(p){return p.field==='shengqi';});if(!hasT)warns.push({level:'warn',text:'完全冇天醫：財運不理想、賺錢辛苦、婚姻不和諧'});if(!hasS||!hasT)warns.push({level:'warn',text:'缺少生氣+天醫：缺乏貴人運'});if(pairs.some(function(p){return p.field==='wugui';})&&pairs.some(function(p){return p.field==='jueming';}))warns.push({level:'bad',text:'五鬼+絕命：容易身體差'});if(digits.indexOf('19')>=0||digits.indexOf('91')>=0)warns.push({level:'bad',text:'含大延年19/91：女性絕對不能使用'});return warns;}
function kindFocus(kind,pairs){var html='',last=pairs.length?FIELDS[pairs[pairs.length-1].field]:null;var counts={};pairs.forEach(function(p){counts[p.field]=(counts[p.field]||0)+1;});var has=function(k){return !!counts[k];};
if(kind==='phone'){html+='<p><strong>分析重點：</strong>後天分身，影響而家。尾段最緊要。</p>';}
else if(kind==='id'){html+='<p><strong>分析重點：</strong>流年運程。教材將身份證數字放兩次：第一輪出世至約48歲，第二輪約48–98歲，星序相同。證件唔能改，用電話／車牌補。</p>';}
else if(kind==='birth'){html+='<p><strong>分析重點：</strong>先天命格，一世唔會變。缺星用電話車牌補。</p>';}
else if(kind==='plate'){html+='<p><strong>分析重點（跟教材）：</strong>車牌係<strong>交通磁場</strong>，用嚟睇開車、出行、路上安危，<strong>唔係命格、亦唔係財運主軸</strong>。</p><p>英文字母已轉成數字（A=01…Z=26）再拆星。車牌數字入面嘅0會跳過唔計。</p>';if(has('wugui'))html+='<p>有五鬼：容易意外、血光、行車起伏大。</p>';if(has('jueming'))html+='<p>有絕命：大上大落，出行宜穩，避免衝動。</p>';if(has('huohai'))html+='<p>有禍害：口舌、開刀開口，亦提醒交通意外。</p>';if(!has('wugui')&&!has('jueming')&&!has('huohai'))html+='<p>未見明顯大兇，出行相對平穩。</p>';if(last)html+='<p>尾段「'+last.name+'」對行車最緊要。</p>';}
else if(kind==='address'){html+='<p><strong>分析重點：</strong>家宅、家人健康、居住安定。</p>';}
else if(kind==='account'){html+='<p><strong>分析重點：</strong>財富進出同守財。</p>';if(has('wugui'))html+='<p>五鬼：錢來得快去得快。</p>';if(has('tianyi'))html+='<p>天醫：有財路但唔守財。</p>';if(has('yannian'))html+='<p>延年：相對識守財。</p>';}
else html+='<p>後天磁場，影響使用呢組數字嘅場景。</p>';
return html;}
function idAgeSpan(i){return i===0?13:5;}
function idCycles(pairs){var n=pairs.length,out=[],age=0;for(var c=1;c<=2;c++){for(var i=0;i<n;i++){var span=idAgeSpan(i),from=age,to=age+span;if(c===2&&i===n-1&&to<98)to=98;out.push({cycle:c,idx:i,from:from,to:to,pair:pairs[i]});age=to;}}return out;}
function stageName(from,to){var mid=(from+to)/2;if(mid<13)return '童年／少年';if(mid<23)return '求學／初入世';if(mid<33)return '立業／成家';if(mid<43)return '事業爬升';if(mid<53)return '中年守成';if(mid<63)return '熟年轉折';if(mid<73)return '準備退休／傳承';return '晚年頤養';}
function starAgeRead(f,from,to){var bits=[];bits.push(from+'–'+to+'歲行「'+f.name+'」（'+f.pol+'／'+f.rank+'），呢段屬'+stageName(from,to)+'。');bits.push(f.short+'。');if(from<18){bits.push('呢段主要睇成長環境、學習同家人關係。'+(f.pol==='吉'?'較易得長輩照顧、讀書有貴人。':'較易有家庭口舌、學習起伏或身體小恙，要家長多留意。'));}else if(from<35){bits.push('事業：'+f.job+'財運：'+f.wealth+'感情：'+f.love);}else if(from<60){bits.push('中年重點係事業同守財。'+f.job+f.wealth+'健康開始浮現：'+f.health);}else{bits.push('晚年重健康同家人。健康：'+f.health+'人際：'+f.friend+(f.note?' '+f.note:''));}if(f.pol==='凶')bits.push('呢段宜穩不宜衝，大事慢半拍，可用電話／車牌補吉星。');return bits.join('');}
function richStory(kind,pairs,digits){var html='',counts={};pairs.forEach(function(p){counts[p.field]=(counts[p.field]||0)+1;});var good=pairs.filter(function(p){return FIELDS[p.field].pol==='吉';});var bad=pairs.filter(function(p){return FIELDS[p.field].pol==='凶';});var last=FIELDS[pairs[pairs.length-1].field];if(kind==='id'){html+='<p><strong>身份證係流年運程，唔係先天命格。</strong>教材做法係將同一組身份證數字<strong>放兩次</strong>：第一輪由出世行到約48歲，第二輪由約48歲再行多一次，去到約98歲。證件本身改唔到，只可以用電話、車牌呢啲後天數字補吉星。</p>';html+='<p>拆開之後一共 '+pairs.length+' 組相鄰兩位數。吉星 '+good.length+' 組、凶星 '+bad.length+' 組。尾段落喺「'+last.name+'」，代表每一輪結尾會行呢粒星。</p>';if(good.length)html+='<p>吉星主要係：'+good.map(function(p){return FIELDS[p.field].name+'（'+p.display+'）';}).filter(function(v,i,a){return a.indexOf(v)===i;}).join('、')+'。吉星段較易有貴人、機會同身體平穩。</p>';if(bad.length)html+='<p>要小心嘅凶星：'+bad.map(function(p){return FIELDS[p.field].name+'（'+p.display+'）';}).filter(function(v,i,a){return a.indexOf(v)===i;}).join('、')+'。凶星段宜守不宜攻，避免衝動投資、手術同長途駕駛（視乎星）。</p>';html+='<p>下面「身份證流年走勢」會按歲數逐段寫。第一輪同第二輪星序完全一樣，只係人生階段唔同，所以同一粒星喺20歲同70歲解讀重點會唔同。</p>';return html;}if(kind==='birth'){html+='<p><strong>出生年月日係先天命格</strong>，出世就定，一世唔會因為換電話而改到。呢組數講底子：性格、身體弱項、先天缺邊粒吉星。</p>';html+='<p>相鄰兩位一組嚟睇，0開頭嘅組合當伏位，跟返前一粒星。而家拆出 '+pairs.length+' 組：吉 '+good.length+'、凶 '+bad.length+'。尾段「'+last.name+'」係先天收結氣場。</p>';html+='<p>先天缺嘅吉星（生氣／天醫／延年），要用後天數字補，最常用係手機同車牌。</p>';return html;}if(kind==='phone'){html+='<p><strong>手機係後天分身</strong>，日日貼身，影響而家運勢，亦係最容易改嘅一組數。教材最重尾段、最後4位、同後五位有冇0。</p>';html+='<p>呢組號碼拆出 '+pairs.length+' 組磁場：吉 '+good.length+'、凶 '+bad.length+'。最後落喺「'+last.name+'」（'+last.short+'）。尾段決定你用呢個號碼期間最常感受到嘅氣場。</p>';html+='<p>0喺電話係隱性弱化，仲要對後五位睇身體部位同宮位；5先至當橋樑。最後4位唔可以有0，亦唔可以有凶星。女性唔用大延年19／91。</p>';return html;}if(kind==='plate'){html+='<p><strong>車牌係交通磁場</strong>，教材用嚟睇開車、出行、路上安危，唔好當事業財運主軸。</p>';html+='<p>英文字母 A=01…Z=26 一齊計；車牌號碼入面嘅0會跳過唔計。拆出 '+pairs.length+' 組：吉 '+good.length+'、凶 '+bad.length+'。尾段「'+last.name+'」對行車最緊要。</p>';if(bad.length)html+='<p>車牌見五鬼、絕命、禍害，要特別小心意外、血光、開刀同衝動駕駛。出行宜穩、避免疲勞駕駛。</p>';else html+='<p>未見明顯大兇交通星，出行相對平穩，仍然要睇尾段星性。</p>';return html;}if(kind==='address'){html+='<p><strong>門牌睇家宅磁場</strong>：家人健康、居住安穩、屋企氣場。字母同樣轉換。拆出 '+pairs.length+' 組，尾段「'+last.name+'」。</p>';html+='<p>事業：'+last.job+'健康：'+last.health+'感情／家人：'+last.love+'</p>';return html;}if(kind==='account'){html+='<p><strong>銀行帳號睇財運進出同守財。</strong>拆出 '+pairs.length+' 組，尾段「'+last.name+'」影響錢點樣進同點樣留。</p>';html+='<p>'+last.wealth+'</p>';if(counts.wugui)html+='<p>有五鬼：錢來得快去得快，唔好用呢個戶口存長錢。</p>';if(counts.yannian)html+='<p>有延年：相對識守財，適合做儲蓄戶。</p>';if(counts.tianyi)html+='<p>有天醫：有財路但天醫本身唔守財，進帳後宜轉走一部分。</p>';return html;}html+='<p>呢組後天數字影響使用場景。拆出 '+pairs.length+' 組，尾段「'+last.name+'」：'+last.short+'。</p>';return html;}
function analyze(){try{var digits='',birthMeta=null,preparedNote='';
if(currentKind==='birth'){var iso=document.getElementById('birthInput').value;if(!iso){alert('請揀出生日期');return;}birthMeta=birthCode(iso);digits=birthMeta.code;preparedNote=birthMeta.text;}
else{var raw=document.getElementById('numInput').value.trim();if(!raw){alert('請輸入數字');return;}
if(currentKind==='plate'){digits=plateToDigits(raw);preparedNote='車牌字母A=01…Z=26，號碼入面嘅0已跳過 → '+digits;}
else {if(currentKind==='id'||currentKind==='address'){var exp=expandLetters(raw);if(exp!==raw)preparedNote='英文字母轉換（A=01…Z=26）後：'+extractDigits(exp);raw=exp;}digits=extractDigits(raw);}}
var pairs=buildPairs(digits,currentKind);if(!pairs.length){alert('有效位數唔夠（字母會轉成兩位數字再計）');return;}
document.getElementById('results').style.display='block';
var roleHtml='<p><span class="tag">'+KIND_INFO[currentKind].tag+'</span>'+KIND_INFO[currentKind].text+'</p>';
if(preparedNote)roleHtml+='<p class="muted">'+preparedNote+'</p>';
if(birthMeta)roleHtml+='<p>先天數：<strong>'+birthMeta.code+'</strong></p>';
roleHtml+=kindFocus(currentKind,pairs);
document.getElementById('roleBox').innerHTML=roleHtml;
var counts={};pairs.forEach(function(p){counts[p.field]=(counts[p.field]||0)+1;});
document.getElementById('storyBox').innerHTML=richStory(currentKind,pairs,digits);
var bar=document.getElementById('starBar');bar.innerHTML='';Object.keys(counts).forEach(function(k){var f=FIELDS[k];var chip=document.createElement('span');chip.className='star-chip '+f.pol;chip.textContent=f.name+' ×'+counts[k];bar.appendChild(chip);});
var luckCard=document.getElementById('luckCard');
if(currentKind==='id'){luckCard.style.display='block';var segs=idCycles(pairs);document.getElementById('luckGrid').innerHTML=segs.map(function(s){var p=s.pair,f=FIELDS[p.field];return '<div class="luck-item '+f.pol+'"><div><strong>'+s.from+'–'+s.to+'歲</strong> · 第'+s.cycle+'輪</div><div>'+p.display+' · '+f.name+'（'+stageName(s.from,s.to)+'）</div><div class="muted">'+starAgeRead(f,s.from,s.to)+'</div></div>';}).join('');}else luckCard.style.display='none';
document.getElementById('pairFlow').innerHTML=pairs.map(function(p){var f=FIELDS[p.field];return '<div class="pair-row"><span class="pair-box">'+p.display+'</span> → <strong>'+f.name+'</strong> <span class="muted">'+f.pol+(p.note?'（'+p.note+'）':'')+'</span></div>';}).join('');
var oldPC=document.getElementById('phoneRuleCard');if(oldPC)oldPC.remove();
if(currentKind==='phone'){var zeroHits=checkPhoneZeros(digits);var ruleWarns=checkPhoneRules(digits,pairs);if(zeroHits.length||ruleWarns.length){var extra='<div class="card" id="phoneRuleCard"><div class="card-title">手機絕對定律／後五位0</div>';if(zeroHits.length){extra+='<ul>';zeroHits.forEach(function(h){extra+='<li>倒數第'+h.pos+'位係0 → <strong>'+h.body+'</strong>｜'+h.palace+'：'+h.effect+'</li>';});extra+='</ul>';}ruleWarns.forEach(function(w){extra+='<div class="'+(w.level==='bad'?'hl-warn':'hl-resolve')+'">'+w.text+'</div>';});extra+='</div>';var tmp=document.createElement('div');tmp.innerHTML=extra;document.getElementById('fixCard').parentNode.insertBefore(tmp.firstChild,document.getElementById('fixCard'));}}
var uniq=[],seen={};pairs.forEach(function(p){if(!seen[p.field]){seen[p.field]=1;uniq.push(p.field);}});
document.getElementById('details').innerHTML=uniq.map(function(k){var f=FIELDS[k];return '<details class="star-detail"><summary>'+f.name+'（'+f.pol+'）</summary><div style="padding:12px"><p>'+f.short+'</p><div class="grid2"><div class="box g">優點：'+f.pros.join('、')+'</div><div class="box b">缺點：'+f.cons.join('、')+'</div></div><p>事業：'+f.job+'</p><p>財運：'+f.wealth+'</p><p>感情：'+f.love+'</p><p>健康：'+f.health+'</p>'+(f.note?'<div class="hl-warn">'+f.note+'</div>':'')+'</div></details>';}).join('');
var missing=['tianyi','yannian','shengqi'].filter(function(k){return !counts[k];});
var lastBad=FIELDS[pairs[pairs.length-1].field].pol==='凶';
var fixCard=document.getElementById('fixCard');
if(currentKind==='birth'||missing.length||lastBad){fixCard.style.display='block';var html='';if(currentKind==='birth')html+='<p>先天唔改號，用電話／車牌補吉星。</p>';if(currentKind==='plate')html+='<p>車牌重點係安全。若尾段兇星，優先換尾段做生氣／天醫／延年。</p>';if(missing.length)html+='<p>缺：'+missing.map(function(k){return FIELDS[k].name;}).join('、')+'</p>';html+='<p>4位推薦（教材生天延）：</p><p><span class="num-sug">1491</span><span class="num-sug">4134</span><span class="num-sug">3943</span><span class="num-sug">9319</span><span class="num-sug">2862</span><span class="num-sug">8278</span></p>';document.getElementById('fixBox').innerHTML=html;}else fixCard.style.display='none';
document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});}catch(err){alert('解讀出錯：'+err.message);}}
document.getElementById('wikiGrid').innerHTML=Object.keys(FIELDS).map(function(k){var f=FIELDS[k];return '<div class="wiki-card"><h3><span class="ptag '+f.pol+'">'+f.rank+'</span> '+f.name+'</h3><p class="muted">'+f.pairs.join('、')+'</p><p>'+f.short+'</p><p>優點：'+f.pros.join('、')+'</p><p>缺點：'+f.cons.join('、')+'</p><p>健康：'+f.health+'</p>'+(f.note?'<div class="hl-warn">'+f.note+'</div>':'')+'</div>';}).join('');
