tianyi:{name:'天醫',pol:'吉',rank:'大吉星',pairs:['13','31','68','86','49','94','27','72'],short:'有錢路同貴人幫一手',detail:'大吉星。主聰明、貴人、財路同正桃花。天醫多代表有人幫、有錢路，但天醫本身唔守財。教材話老人唔宜天醫太多。電話有天醫較易賺錢同遇貴人；車牌有天醫唔等於行車一定平安。',pros:['聰明睿智','善解人意','心胸開闊','學習能力強'],cons:['太善良','沒主見','容易被騙'],job:'能成就事業，帶來連續財富。',wealth:'正財偏財都有，但唔會守財。',love:'正桃花、婚姻美滿；女性旺夫。',health:'血壓、血液循環、眼耳鼻。',friend:'易遇貴人。',note:'老年人唔宜天醫太多。'},

yannian:{name:'延年',pol:'吉',rank:'小吉星',pairs:['19','91','78','87','34','43','26','62'],short:'有主見、肯扛責任',detail:'小吉星，主定力、責任、守財同專業能力。延年可以定住天醫／生氣帶嚟嘅財同人緣。大延年19／91女性絕對唔用。車牌尾段用延年，行車相對穩。',pros:['領導格局','懂守財'],cons:['固執','不圓滑'],job:'專業能力強，易成領導。',wealth:'靠自己辛苦，識守財。',love:'專一高標準。',health:'肩頸腰、睡眠、心臟。',friend:'真正夥伴耐。',note:'⚠️大延年19/91女性不能使用。'},

huohai:{name:'禍害',pol:'凶',rank:'小兇星',pairs:['17','71','89','98','46','64','23','32'],short:'口舌是非、易開刀意外',detail:'小兇星。主口舌是非、脾氣、開刀同意外。有口才可以用喺以口為業，但日常生活易得罪人、易破財。車牌見禍害要特別小心交通意外同開口衝突。',pros:['口才好'],cons:['脾氣差','口舌'],job:'以口為業。',wealth:'開口來財，易破財。',love:'易吵架。',health:'呼吸道、開刀、意外。',friend:'小心讒言。',note:'車牌見禍害要小心交通意外。',fix:'後天補生氣減口舌，尾段用延年定住。車牌／電話唔好以禍害收尾。手術同長途車要額外小心。'},
liusha:{name:'六煞',pol:'凶',rank:'小兇星',pairs:['16','61','47','74','38','83','29','92'],short:'感情情緒煩、易破財',detail:'小兇星。主感情煩、情緒、偏桃花同人際破財。交際能力強，但界線唔清就容易為情所困。六煞加五鬼，教材話離婚率高。帳號尾段六煞唔利守財。',pros:['交際強','異性緣'],cons:['情緒化','為情所困'],job:'公關中介服務。',wealth:'人際來財唔守。',love:'偏桃花。',health:'皮膚腸胃情緒。',friend:'界線要清。',note:'六煞+五鬼離婚率高。',fix:'後天補延年守感情同錢，再補天醫轉正桃花。帳號唔好用六煞做尾段。少借錢擔保。'},
wugui:{name:'五鬼',pol:'凶',rank:'大兇星',pairs:['18','81','79','97','36','63','24','42'],short:'起起落落、錢來得快去得快',detail:'大兇星。主起起落落、偏財來去快、血光意外。有鬼才，適合變動大嘅行業，但婚姻同身體都要小心。車牌五鬼係出行大忌。五鬼加絕命，教材話容易身體差。',pros:['鬼才創新'],cons:['反復無常'],job:'變動多嘅行業。',wealth:'偏財來去快。',love:'不利婚姻。',health:'意外血光、心臟病代名詞。',friend:'人脈流動大。',note:'車牌見五鬼要特別留意意外。',fix:'後天用生氣+天醫把偏財拉返正路。車牌尾段唔好五鬼。投資只用閒錢，避免夜間疲勞駕駛。'},

};
const PAIR_MAP={};Object.keys(FIELDS).forEach(function(k){FIELDS[k].pairs.forEach(function(p){PAIR_MAP[p]=k;});});
const KIND_INFO={phone:{tag:'後天分身',text:'影響而家運勢。重點睇尾段、後五位0、絕對定律。',ph:'例如 98764321'},id:{tag:'流年運程',text:'證件數字循環重複：第一段0–13歲，之後每5年一段，星序行完再由頭再行，直至98歲。證件本身唔能改。',ph:'例如 A123456(7)'},birth:{tag:'先天命格',text:'出世就定，只講底子，唔用嚟改號。',ph:''},plate:{tag:'交通磁場',text:'教材用車牌睇開車、出行同路上安危，唔係睇事業財運。英文字母一齊計（A=01…Z=26）。車牌唔計0。',ph:'例如 AB1234'},address:{tag:'家宅磁場',text:'門牌睇家宅、家人健康、居住氣場。字母同樣轉換。',ph:'例如 8A'},account:{tag:'財運磁場',text:'帳號睇財富進出同守財。',ph:'例如 0123456789'},other:{tag:'後天磁場',text:'日常數字影響使用場景。',ph:'輸入數字'}};
let currentKind='phone';
function bindUI(){
 document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});document.getElementById('sec-'+t.getAttribute('data-sec')).classList.add('active');});});
 document.querySelectorAll('#kindPills .pill').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('#kindPills .pill').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');currentKind=btn.getAttribute('data-kind');document.getElementById('kindHint').innerHTML='<span class="tag">'+KIND_INFO[currentKind].tag+'</span>'+KIND_INFO[currentKind].text;document.getElementById('inputText').style.display=currentKind==='birth'?'none':'block';document.getElementById('inputBirth').style.display=currentKind==='birth'?'block':'none';if(KIND_INFO[currentKind].ph)document.getElementById('numInput').placeholder=KIND_INFO[currentKind].ph;});});

}
function expandLetters(s){return s.replace(/[A-Za-z]/g,function(ch){return String(ch.toUpperCase().charCodeAt(0)-64).padStart(2,'0');});}
function plateToDigits(s){var out='';for(var i=0;i<s.length;i++){var ch=s.charAt(i);if(/[A-Za-z]/.test(ch))out+=String(ch.toUpperCase().charCodeAt(0)-64).padStart(2,'0');else if(/[1-9]/.test(ch))out+=ch;}return out;}
function extractDigits(s){return (s.match(/\d/g)||[]).join('');}
function birthCode(iso){if(!iso)return null;var p=iso.split('-');var y=+p[0],m=+p[1],d=+p[2];var base=y<=2000?1911:1971;var yearNum=y-base;var lm=m,ld=d,usedLunar=false,lunarText='';try{var fn=solarLunar&&(solarLunar.solar2lunar||(solarLunar.default&&solarLunar.default.solar2lunar));if(fn){var L=fn(y,m,d);if(L&&(L.lMonth||L.month)){lm=L.lMonth||L.month;ld=L.lDay||L.day;usedLunar=true;lunarText='農曆'+(L.isLeap||L.isLeapMonth?'閏':'')+lm+'月'+ld+'日';}}}catch(e){}
var code=String(yearNum)+String(lm)+String(ld).padStart(2,'0');
return {code:code,text:y+'年'+m+'月'+d+'日（新曆）→ '+(usedLunar?lunarText:'暫用新曆月日')+'；'+y+'−'+base+'='+yearNum+' + '+lm+String(ld).padStart(2,'0')+' → '+code};}
function buildPairs(digits,kind){if(kind==='birth'||kind==='plate'){var out=[];for(var i=0;i<digits.length-1;i++){var pair=digits.charAt(i)+digits.charAt(i+1);var key=PAIR_MAP[pair];var field=key||'fuwei';var note=key?'':(pair.indexOf('0')>=0?'含0當伏位':'非標準當伏位');if(field==='fuwei'&&out.length){field=out[out.length-1].field;note+=(note?'；':'')+'伏位延續「'+FIELDS[field].name+'」';}out.push({pair:pair,display:pair,field:field,connector:null,note:note});}return out;}
var source=kind==='phone'?digits:digits.replace(/5/g,'');var core=[],pending='';for(var i=0;i<source.length;i++){var ch=source.charAt(i);if(ch==='0'||(kind==='phone'&&ch==='5'))pending+=ch;else{core.push({d:ch,bridge:pending});pending='';}}var trailing=pending,out=[];for(var j=1;j<core.length;j++){var a=core[j-1].d,b=core[j].d,bridge=core[j].bridge;var pair=a+b,key=PAIR_MAP[pair];if(!key)continue;var connector=null;if(kind==='phone'&&bridge.indexOf('5')>=0)connector='5';else if(bridge.indexOf('0')>=0)connector='0';var field=key,note='';if(connector==='5')note='夾5顯性';if(connector==='0')note='夾0隱性弱化';if(key==='fuwei'&&out.length){field=out[out.length-1].field;note+=(note?'；':'')+'伏位延續「'+FIELDS[field].name+'」';}out.push({pair:pair,display:a+bridge+b,field:field,connector:connector,note:note});}if(out.length&&trailing){var last=out[out.length-1];if(trailing.indexOf('0')>=0){last.display+=trailing;last.note=(last.note||'')+'；尾0放大';}}return out;}
var BODY_POS=['腿腳','腰腹','腸胃','胸腔','腦袋'];
var PALACE_POS=[{name:'子女／下屬宮',effect:'下屬或孩子不聽話，或孩子身體差'},{name:'夫妻宮',effect:'夫妻宮空：感情不好、兩地分離，或對方身體不好'},{name:'自己宮',effect:'自己付出多都沒有收穫'},{name:'兄弟朋友宮',effect:'人際關係不佳，遇事外力無助'},{name:'父母宮',effect:'與父母感情不好，或父母身體欠佳／離世'}];
function checkPhoneZeros(digits){var last5=digits.slice(-5),hits=[];for(var i=0;i<last5.length;i++){if(last5.charAt(i)==='0'){var fromEnd=last5.length-1-i;if(fromEnd<5)hits.push({pos:fromEnd+1,body:BODY_POS[fromEnd],palace:PALACE_POS[fromEnd].name,effect:PALACE_POS[fromEnd].effect});}}return hits;}
function checkPhoneRules(digits,pairs){var warns=[],last4=digits.slice(-4);if(last4.indexOf('0')>=0)warns.push({level:'bad',text:'最後4位含有0（教材：手機最後4位不可以為0）'});for(var i=0;i<last4.length-1;i++){var pp=last4.charAt(i)+last4.charAt(i+1);var fk=PAIR_MAP[pp];if(fk&&FIELDS[fk].pol==='凶'){warns.push({level:'bad',text:'最後4位出現兇星「'+FIELDS[fk].name+'」（'+pp+'）'});break;}}if(digits.indexOf('00')>=0)warns.push({level:'warn',text:'出現00：容易成為別人踏腳石'});var hasT=pairs.some(function(p){return p.field==='tianyi';});var hasS=pairs.some(function(p){return p.field==='shengqi';});if(!hasT)warns.push({level:'warn',text:'完全冇天醫：財運不理想、賺錢辛苦、婚姻不和諧'});if(!hasS||!hasT)warns.push({level:'warn',text:'缺少生氣+天醫：缺乏貴人運'});if(pairs.some(function(p){return p.field==='wugui';})&&pairs.some(function(p){return p.field==='jueming';}))warns.push({level:'bad',text:'五鬼+絕命：容易身體差'});if(digits.indexOf('19')>=0||digits.indexOf('91')>=0)warns.push({level:'bad',text:'含大延年19/91：女性絕對不能使用'});return warns;}
function kindFocus(kind,pairs){var html='',last=pairs.length?FIELDS[pairs[pairs.length-1].field]:null;var counts={};pairs.forEach(function(p){counts[p.field]=(counts[p.field]||0)+1;});var has=function(k){return !!counts[k];};
if(kind==='phone')html+='<p><strong>分析重點：</strong>後天分身，影響而家。尾段最緊要。</p>';
else if(kind==='id')html+='<p><strong>分析重點：</strong>流年運程。星序不斷重複。第一段0–13歲，之後每5年至98歲。</p>';
else if(kind==='birth')html+='<p><strong>分析重點：</strong>先天命格，一世唔會變。缺星用電話車牌補。</p>';
else if(kind==='plate'){html+='<p><strong>分析重點：</strong>車牌睇開車出行安危。字母A=01…Z=26，號碼0跳過。</p>';if(has('wugui'))html+='<p>有五鬼：行車起伏。</p>';if(has('jueming'))html+='<p>有絕命：出行宜穩。</p>';if(has('huohai'))html+='<p>有禍害：小心交通意外。</p>';}
else if(kind==='address')html+='<p><strong>分析重點：</strong>家宅、家人健康。</p>';
else if(kind==='account')html+='<p><strong>分析重點：</strong>財富進出同守財。</p>';
else html+='<p>後天磁場。</p>';
return html;}
function idCycles(pairs){var n=pairs.length,out=[];out.push({from:0,to:13,pair:pairs[0]});var age=13,i=1;while(age<98){var from=age,to=Math.min(age+5,98);out.push({from:from,to:to,pair:pairs[i%n]});age=to;i++;}return out;}
function stageName(from,to){var mid=(from+to)/2;if(mid<13)return '童年／少年';if(mid<23)return '求學／初入世';if(mid<33)return '立業／成家';if(mid<43)return '事業爬升';if(mid<53)return '中年守成';if(mid<63)return '熟年轉折';if(mid<73)return '準備退休／傳承';return '晚年頤養';}
function starAgeRead(f,from,to){var bits=[];bits.push(from+'–'+to+'歲行「'+f.name+'」（'+f.pol+'），屬'+stageName(from,to)+'。'+f.short+'。');if(f.pol==='凶'&&f.fix)bits.push('化解：'+f.fix);return bits.join('');}
function richStory(kind,pairs){var html='',good=pairs.filter(function(p){return FIELDS[p.field].pol==='吉';}).length,bad=pairs.filter(function(p){return FIELDS[p.field].pol==='凶';}).length,last=FIELDS[pairs[pairs.length-1].field];
if(kind==='id')html+='<p>身份證係流年，星序不斷重複。第一段0–13歲，之後每5年至98歲。證件改唔到，用電話車牌補。</p>';
else if(kind==='birth')html+='<p>先天命格出世就定，缺星用手機車牌補。</p>';
else if(kind==='phone')html+='<p>手機係後天分身。尾段「'+last.name+'」。最後4位唔可以有0同凶星。</p>';
else if(kind==='plate')html+='<p>車牌係交通磁場。尾段「'+last.name+'」。</p>';
else html+='<p>尾段「'+last.name+'」：'+last.short+'。</p>';
html+='<p>吉 '+good+' 組、凶 '+bad+' 組。</p>';return html;}
function wikiCard(f){return '<div class="wiki-card"><h3><span class="ptag '+f.pol+'">'+f.rank+'</span> '+f.name+'</h3><p class="muted">組合：'+f.pairs.join('、')+'</p><p><strong>'+f.short+'</strong></p><p>'+(f.detail||'')+'</p><div class="grid2"><div class="box g">優點：'+f.pros.join('、')+'</div><div class="box b">缺點：'+f.cons.join('、')+'</div></div><p><strong>事業</strong>：'+f.job+'</p><p><strong>財運</strong>：'+f.wealth+'</p><p><strong>感情</strong>：'+f.love+'</p><p><strong>健康</strong>：'+f.health+'</p><p><strong>人際</strong>：'+f.friend+'</p>'+(f.note?'<div class="hl-warn"><strong>注意：</strong>'+f.note+'</div>':'')+(f.fix?'<div class="hl-resolve"><strong>化解：</strong>'+f.fix+'</div>':'')+'</div>';}
function analyze(){try{var digits='',birthMeta=null,preparedNote='';
if(currentKind==='birth'){var iso=document.getElementById('birthInput').value;if(!iso){alert('請揀出生日期');return;}birthMeta=birthCode(iso);digits=birthMeta.code;preparedNote=birthMeta.text;}
else{var raw=document.getElementById('numInput').value.trim();if(!raw){alert('請輸入數字');return;}
if(currentKind==='plate'){digits=plateToDigits(raw);preparedNote='車牌字母A=01…Z=26，號碼0已跳過 → '+digits;}
else {if(currentKind==='id'||currentKind==='address'){var exp=expandLetters(raw);if(exp!==raw)preparedNote='字母轉換後：'+extractDigits(exp);raw=exp;}digits=extractDigits(raw);}}
var pairs=buildPairs(digits,currentKind);if(!pairs.length){alert('有效位數唔夠');return;}
document.getElementById('results').style.display='block';
var roleHtml='<p><span class="tag">'+KIND_INFO[currentKind].tag+'</span>'+KIND_INFO[currentKind].text+'</p>';
if(preparedNote)roleHtml+='<p class="muted">'+preparedNote+'</p>';
if(birthMeta)roleHtml+='<p>先天數：<strong>'+birthMeta.code+'</strong></p>';
roleHtml+=kindFocus(currentKind,pairs);
document.getElementById('roleBox').innerHTML=roleHtml;
var counts={};pairs.forEach(function(p){counts[p.field]=(counts[p.field]||0)+1;});
document.getElementById('storyBox').innerHTML=richStory(currentKind,pairs);
var bar=document.getElementById('starBar');bar.innerHTML='';Object.keys(counts).forEach(function(k){var f=FIELDS[k];var chip=document.createElement('span');chip.className='star-chip '+f.pol;chip.textContent=f.name+' ×'+counts[k];bar.appendChild(chip);});
var luckCard=document.getElementById('luckCard');
if(currentKind==='id'){luckCard.style.display='block';document.getElementById('luckGrid').innerHTML=idCycles(pairs).map(function(s){var p=s.pair,f=FIELDS[p.field];return '<div class="luck-item '+f.pol+'"><div><strong>'+s.from+'–'+s.to+'歲</strong></div><div>'+p.display+' · '+f.name+'（'+stageName(s.from,s.to)+'）</div><div class="muted">'+starAgeRead(f,s.from,s.to)+'</div></div>';}).join('');}else luckCard.style.display='none';
document.getElementById('pairFlow').innerHTML=pairs.map(function(p){var f=FIELDS[p.field];return '<div class="pair-row"><span class="pair-box">'+p.display+'</span> → <strong>'+f.name+'</strong> <span class="muted">'+f.pol+(p.note?'（'+p.note+'）':'')+'</span></div>';}).join('');
var oldPC=document.getElementById('phoneRuleCard');if(oldPC)oldPC.remove();
if(currentKind==='phone'){var zeroHits=checkPhoneZeros(digits);var ruleWarns=checkPhoneRules(digits,pairs);if(zeroHits.length||ruleWarns.length){var extra='<div class="card" id="phoneRuleCard"><div class="card-title">手機絕對定律／後五位0</div>';if(zeroHits.length){extra+='<ul>';zeroHits.forEach(function(h){extra+='<li>倒數第'+h.pos+'位係0 → <strong>'+h.body+'</strong>｜'+h.palace+'：'+h.effect+'</li>';});extra+='</ul>';}ruleWarns.forEach(function(w){extra+='<div class="hl-warn">'+w.text+'</div>';});extra+='</div>';var tmp=document.createElement('div');tmp.innerHTML=extra;document.getElementById('fixCard').parentNode.insertBefore(tmp.firstChild,document.getElementById('fixCard'));}}
var uniq=[],seen={};pairs.forEach(function(p){if(!seen[p.field]){seen[p.field]=1;uniq.push(p.field);}});
document.getElementById('details').innerHTML=uniq.map(function(k){return wikiCard(FIELDS[k]).replace('wiki-card','star-detail');}).join('');
var missing=['tianyi','yannian','shengqi'].filter(function(k){return !counts[k];});
var lastBad=FIELDS[pairs[pairs.length-1].field].pol==='凶';
var fixCard=document.getElementById('fixCard');
var bads=uniq.filter(function(k){return FIELDS[k].pol==='凶';});
if(currentKind==='birth'||missing.length||lastBad||bads.length){fixCard.style.display='block';var html='<p><strong>化解原則：</strong>先天同證件改唔到。用後天（電話最緊要，其次車牌）補<strong>生氣＋天醫＋延年</strong>。唔好用凶星剋凶星。電話最後4位唔可以有0同凶星；女性唔用19／91。</p>';
if(currentKind==='birth')html+='<p>先天只可以喺電話／車牌補。</p>';
if(currentKind==='id')html+='<p>流年改唔到，行凶星嗰段歲數用電話尾段蓋過。</p>';
if(currentKind==='plate')html+='<p>車牌尾段優先用生氣／天醫／延年，避開五鬼、絕命、禍害收尾。</p>';
if(bads.length){html+='<p><strong>出現嘅凶星：</strong></p>';bads.forEach(function(k){var f=FIELDS[k];html+='<div class="hl-warn"><strong>'+f.name+'</strong>：'+f.short+(f.fix?'<br>化解：'+f.fix:'')+'</div>';});}
if(missing.length)html+='<p>後天建議補：'+missing.map(function(k){return FIELDS[k].name;}).join('、')+'</p>';
html+='<p>教材4位（生天延）：</p><p><span class="num-sug">1491</span><span class="num-sug">4134</span><span class="num-sug">3943</span><span class="num-sug">9319</span><span class="num-sug">2862</span><span class="num-sug">8278</span><span class="num-sug">6726</span><span class="num-sug">7687</span></p>';
html+='<p class="muted">6位可接兩組4位吉鏈，例如149134，中間相鄰都要係吉星。</p>';
document.getElementById('fixBox').innerHTML=html;}else fixCard.style.display='none';
document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});}catch(err){alert('解讀出錯：'+err.message);}}
document.getElementById('wikiGrid').innerHTML='<p class="muted" style="margin-bottom:14px">八大磁場係愛德華好命密碼嘅核心。吉星要識用，凶星要識避，再用後天數字補。伏位永遠跟前面嗰粒星。</p>'+Object.keys(FIELDS).map(function(k){return wikiCard(FIELDS[k]);}).join('');
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bindUI);else bindUI();
</script></body></html>
